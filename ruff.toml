# Pin the lint rule set so `ruff check` means the same thing in every ruff
# version. ruff 0.17 widened its defaults (FURB, PL, UP, RUF, ...) and would
# fail CI on the `re.I` aliases and the intentional BiDi characters in
# scanner.py. These are the rules the project was written and reviewed
# against.
target-version = "py310"
line-length = 88

[lint]
select = ["E4", "E7", "E9", "F"]
